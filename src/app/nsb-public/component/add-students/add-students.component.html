<div class="p-6 max-w-lg w-full">
  <h2 class="text-2xl font-semibold mb-4 text-gray-800">
    {{ data ? 'Edit Student' : 'Add Student' }}
  </h2>

  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">First name</label>
      <input formControlName="firstName" type="text"
             placeholder="John"
             class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm
                    focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Last name</label>
      <input formControlName="lastName" type="text"
             placeholder="Doe"
             class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm
                    focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
    </div>

     <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Age</label>
      <input formControlName="age" type="text"
             placeholder="10"
             class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm
                    focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
    </div>
     <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input formControlName="email" type="text"
             placeholder="abc@gmail.com"
             class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm
                    focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
    </div>

     <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Grade</label>
      <input formControlName="grade" type="text"
             placeholder="Eneter Grade"
             class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm
                    focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
    </div>



    <div class="flex items-center justify-end space-x-3 pt-3">
      <button type="button" (click)="dialogRef.close()"
              class="px-4 py-2 rounded-md border border-gray-300 text-gray-700 bg-white hover:bg-gray-50">
        Cancel
      </button>
      <button type="submit"
              class="px-4 py-2 rounded-md bg-indigo-600 text-white hover:bg-indigo-700">
        {{ data ? 'Save' : 'Add' }}
      </button>
    </div>
  </form>
</div>
